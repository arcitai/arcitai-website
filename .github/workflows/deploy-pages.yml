name: Deploy Cloudflare Pages

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, tag, or branch to build (use a known-good SHA for recovery)
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install from lockfile
        run: npm ci --ignore-scripts

      - name: Run release gates
        run: npm run check && npm run audit

      - name: Verify Cloudflare credentials are configured
        run: test -n "$CLOUDFLARE_API_TOKEN" && test -n "$CLOUDFLARE_ACCOUNT_ID"

      - name: Deploy dist to Cloudflare Pages
        run: >-
          npx --yes wrangler@4.103.0 pages deploy dist
          --project-name arcitai --branch main
