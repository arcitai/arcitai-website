    <script>
      (() => {
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";

        const navigation = performance.getEntriesByType("navigation")[0];
        const isReload = navigation?.type === "reload" || performance.navigation?.type === 1;
        if (!isReload) return;

        try {
          const cleanUrl = new URL(window.location.href);
          cleanUrl.hash = "";
          history.replaceState(history.state, "", cleanUrl.href);
        } catch {
          // A scroll reset still provides the intended recovery if URL parsing is unavailable.
        }

        const resetScroll = () => window.scrollTo(0, 0);
        resetScroll();
        window.addEventListener("DOMContentLoaded", resetScroll, { once: true });
        window.addEventListener("load", resetScroll, { once: true });
      })();
    </script>
